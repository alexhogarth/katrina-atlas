name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish KatrinaApp.Client/KatrinaApp.Client.csproj -c Release -o publish

      - name: Point <base href> at the Pages sub-path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          base="/$repo/"
          # User/org sites (<name>.github.io) and custom domains are served from the root.
          if [[ "$repo" == *.github.io || -f KatrinaApp.Client/wwwroot/CNAME ]]; then base="/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" publish/wwwroot/index.html
          # Unknown paths fall back to the app, which shows its own not-found page.
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
